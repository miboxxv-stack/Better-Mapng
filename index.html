        <h1>
          Better MapNG - Real-World Terrain Generator for BeamNG.drive

          Better MapNG is a real-world terrain generator that converts
          geographic data into terrain and game-ready assets for BeamNG.drive.

        <ul>

            Generate heightmaps from real-world locations
          </li>

            Standard 30m global, USGS 1m USA, and GPXZ elevation sources
          </li>

          <li>
            High-resolution satellite textures
          </li>

          <li>
            Procedural OSM textures with road overlays
          </li>

          <li>
            Hybrid satellite + road overlay textures
          </li>

          <li>
            Interactive 3D terrain preview
          </li>

            3D buildings, trees, and barriers from OpenStreetMap data
          </li>

          <li>
            16-bit heightmaps, GeoTIFF, GeoJSON, GLB, DAE, BeamNG .ter,
            and experimental BeamNG level packages
          </li>

          <li>
            Surrounding terrain tile downloads
          </li>

          <li>
            Batch processing for terrain tile grids
          </li>

          <li>
            Combined BeamNG level export
          </li>
